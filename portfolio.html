<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 32px 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background-color: #334155;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
            transform: translateY(-2px);
        }

        .contact-info {
            border-top: 1px solid #334155;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.9rem;
        }

        .contact-info a {
            color: #38bdf8;
            text-decoration: none;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <img class="profile-img" src="C:\Users\DELL\OneDrive\portfolio\Mimg.jpg" alt="Profile Picture">
        
        <h1>Your Name</h1>
        <p class="subtitle">Web Developer | Designer | Creator</p>

        <div class="links-container">
            <a href="http://linkedin.com/in/mahak-rao-576553293" target="_blank" class="btn">LinkedIn Profile</a>
            <a href="https://www.instagram.com/mahakrao/" target="_blank" class="btn">Instagram Profile</a>
            <a href="https://github.com/mahakrao2503-gif" target="_blank" class="btn">GitHub Profile</a>
        </div>

        <div class="contact-info">
            <p><strong>Email:</strong> <a href="mailto:mahakrao2503@gmail.com">mahakrao2503@gmail.com</a></p>
            <p><strong>Phone:</strong> <a href="tel:+918808806207">+91 8808806207</a></p>
       </div>
    </div>

</body>
</html>
